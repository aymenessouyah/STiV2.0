name: Vérifier la version publiée
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier le numéro et la date UTC
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 outils/publication/version.py --verifier --base "$BASE_SHA"
