<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Les 37 Défis — JavaScript • STI Quiz</title>
<script>
/* Theme plateforme STI : suit le mode clair/sombre enregistre (localStorage sti-theme/theme) */
(function(){function ap(t){if(t!=="dark"&&t!=="light")return;document.documentElement.setAttribute("data-theme",t);document.documentElement.classList.toggle("dark-mode",t==="dark");}
try{ap(localStorage.getItem("sti-theme")||localStorage.getItem("theme"));}catch(e){}
window.addEventListener("storage",function(e){if(e.key==="sti-theme"||e.key==="theme")ap(e.newValue);});})();
</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#f4f5f9;--surface:#ffffff;--border:#e1e4ec;--border-hover:#c3c9da;--text:#14161f;--muted:#5b6172;--accent:#4338ca;--accent-soft:#eceafd;--c-js:#b8860b;--ok:#15803d;--warn:#b45309;--err:#dc2626;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
  html,body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);background-image:radial-gradient(circle,#dfe2ec 1px,transparent 1px);background-size:26px 26px;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:calc(12px + var(--safe-top)) 16px 12px}
  .header-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .header-title{flex:1}
  .header-title h1{font-size:1.15rem;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,var(--accent),var(--c-js));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .header-title p{font-size:.72rem;color:var(--muted);font-weight:500;margin-top:2px}
  .progress-pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);padding:7px 12px;border-radius:30px;font-size:.75rem;font-weight:800;flex-shrink:0}
  .progress-pill .circle{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .progress-track{height:6px;background:#e7eaf2;border-radius:10px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--c-js));border-radius:10px;transition:width .6s;width:2.7%;box-shadow:0 0 10px rgba(67,56,202,.35)}

  /* ===== ONGLETS FAMILLES — RESPONSIVE ===== */
  .familles-tabs{
    position:sticky;top:calc(80px + var(--safe-top));z-index:90;
    background:rgba(255,255,255,.88);backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    padding:10px 12px;
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  }
  .famille-tab{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:30px;background:var(--surface);border:1.5px solid var(--border);color:var(--muted);font-weight:700;font-size:.78rem;cursor:pointer;transition:all .25s;white-space:nowrap;font-family:inherit}
  .famille-tab:hover{border-color:var(--border-hover);color:var(--text)}
  .famille-tab.actif{color:white;border-color:transparent;box-shadow:0 4px 16px rgba(20,22,31,.25)}
  .famille-tab .tab-emoji{font-size:1rem}
  .famille-tab .tab-count{font-size:.65rem;opacity:.7;background:rgba(20,22,31,.08);padding:2px 6px;border-radius:10px;font-weight:800}
  .famille-tab.actif[data-fam="A"]{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
  .famille-tab.actif[data-fam="B"]{background:linear-gradient(135deg,#06b6d4,#22d3ee)}
  .famille-tab.actif[data-fam="C"]{background:linear-gradient(135deg,#a855f7,#c084fc)}
  .famille-tab.actif[data-fam="D"]{background:linear-gradient(135deg,#f97316,#fb923c)}
  .famille-tab.actif[data-fam="E"]{background:linear-gradient(135deg,#22c55e,#4ade80)}
  .famille-tab.actif[data-fam="F"]{background:linear-gradient(135deg,#eab308,#facc15);color:#1a1a2e}
  .famille-tab.actif[data-fam="G"]{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
  .famille-tab.actif[data-fam="H"]{background:linear-gradient(135deg,#ec4899,#f472b6)}
  .famille-tab.actif[data-fam="I"]{background:linear-gradient(135deg,#14b8a6,#2dd4bf)}
  .famille-tab.actif[data-fam="J"]{background:linear-gradient(135deg,#ef4444,#f87171)}
  .famille-tab.actif[data-fam="K"]{background:linear-gradient(135deg,#6366f1,#818cf8)}

  /* Sur mobile : scroll horizontal */
  @media (max-width: 767px) {
    .familles-tabs{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;scrollbar-width:none;-ms-overflow-style:none}
    .familles-tabs::-webkit-scrollbar{display:none}
  }

  .main{max-width:1100px;margin:0 auto;padding:16px;padding-bottom:calc(30px + var(--safe-bottom))}
  .famille-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);position:relative;overflow:hidden}
  .famille-header::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fam-color,#7c6df2)}
  .famille-header .fh-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--fam-color-bg);flex-shrink:0}
  .famille-header h2{font-size:1.05rem;font-weight:800;margin-bottom:2px}
  .famille-header p{font-size:.75rem;color:var(--muted);font-weight:500}
  .grille{display:grid;grid-template-columns:1fr;gap:12px}
  .card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;font-family:inherit;color:var(--text);text-align:left;width:100%}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fam-color);opacity:.5;transition:opacity .25s}
  .card:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,22,31,.14)}
  .card:hover::before{opacity:1}
  .card.visite{background:rgba(34,197,94,.05);border-color:rgba(34,197,94,.25)}
  .card.visite::before{background:var(--ok);opacity:1}
  .card-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--fam-color-bg);flex-shrink:0;position:relative}
  .card.visite .card-icon::after{content:'✓';position:absolute;bottom:-4px;right:-4px;width:20px;height:20px;background:var(--ok);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:900;border:2px solid var(--bg);animation:popIn .3s}
  @keyframes popIn{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  .card-content{flex:1;min-width:0}
  .card-title{font-size:.95rem;font-weight:700;margin-bottom:6px;line-height:1.3}
  .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge-niveau{font-size:.65rem;font-weight:800;padding:3px 8px;border-radius:6px}
  .badge-facile{background:rgba(34,197,94,.15);color:#15803d}
  .badge-moyen{background:rgba(245,158,11,.15);color:#b45309}
  .badge-difficile{background:rgba(239,68,68,.15);color:#dc2626}
  .card-status{font-size:.68rem;font-weight:700;color:var(--muted)}
  .card.visite .card-status{color:var(--ok)}
  .card-arrow{font-size:1.2rem;color:var(--muted);flex-shrink:0;transition:transform .25s}
  .card:hover .card-arrow{transform:translateX(4px);color:var(--fam-color)}
  .overlay{position:fixed;inset:0;background:rgba(20,22,31,.65);backdrop-filter:blur(4px);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
  .overlay.actif{opacity:1;pointer-events:auto}
  .panneau{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--border);box-shadow:0 -20px 60px rgba(20,22,31,.35);z-index:200;transform:translateY(100%);transition:transform .4s;display:flex;flex-direction:column;overflow:hidden}
  .panneau.ouvert{transform:translateY(0)}
  .panneau-handle{padding:10px 0 4px;display:flex;justify-content:center;flex-shrink:0}
  .panneau-handle::before{content:'';width:40px;height:4px;background:#c9cedd;border-radius:10px}
  .panneau-head{padding:8px 20px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
  .panneau-head .ph-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:var(--fam-color-bg);flex-shrink:0}
  .panneau-head .ph-title{flex:1;font-size:1rem;font-weight:800;line-height:1.25}
  .panneau-head .ph-close{width:36px;height:36px;border-radius:10px;background:#ffffff;border:1px solid var(--border);color:var(--muted);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
  .panneau-head .ph-close:hover{color:var(--err);background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
  .panneau-body{padding:20px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .panneau-body::-webkit-scrollbar{width:6px}
  .panneau-body::-webkit-scrollbar-thumb{background:var(--border-hover);border-radius:10px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:.72rem;font-weight:800;margin-bottom:16px}
  .badge-easy{background:rgba(34,197,94,.15);color:#15803d;border:1px solid rgba(34,197,94,.3)}
  .badge-med{background:rgba(245,158,11,.15);color:#b45309;border:1px solid rgba(245,158,11,.3)}
  .badge-hard{background:rgba(239,68,68,.15);color:#dc2626;border:1px solid rgba(239,68,68,.3)}
  .enonce{background:var(--accent-soft);border:1px solid #d4cff5;border-left:3px solid var(--accent);border-radius:12px;padding:14px 16px;font-size:.85rem;line-height:1.65;color:#3c4257;margin-bottom:18px}
  .enonce strong{color:var(--accent);font-weight:700}
  .enonce code{background:#ffffff;padding:2px 6px;border-radius:4px;color:var(--c-js);font-family:'SF Mono',Consolas,monospace;font-size:.85em}
  .field input,.field select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:#ffffff;color:var(--text);font-size:.95rem;font-family:inherit}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(67,56,202,.15)}
  .field label{display:block;margin-bottom:6px;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .field-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .field-row label{width:90px;margin-bottom:0;font-size:.75rem;flex-shrink:0}
  .field-row input{flex:1;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:#ffffff;color:var(--text);font-size:.95rem;font-family:inherit}
  .btn{background:linear-gradient(135deg,var(--accent),var(--c-js));color:white;border:none;padding:12px 18px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(67,56,202,.3);font-family:inherit;min-height:44px}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(67,56,202,.45)}
  .btn+.btn{margin-left:6px}
  .btn-secondary{background:#ffffff;border:1.5px solid var(--border);color:var(--text);box-shadow:none}
  .btn-secondary:hover{background:#eef0f6;border-color:var(--border-hover);box-shadow:none}
  .resultat{margin-top:16px;padding:14px 16px;background:#f8f9fc;border:1.5px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;font-size:.9rem;line-height:1.65;color:var(--text);min-height:20px;word-break:break-word}
  .resultat.grand{font-size:1.5rem;letter-spacing:3px;font-weight:800;color:var(--accent);text-align:center;padding:18px}
  .resultat ul{margin-left:18px}
  .resultat li{margin-bottom:4px}
  .btn-correction{background:#ffffff;border:1.5px solid var(--border);color:var(--text);padding:12px 18px;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;width:100%;margin-top:16px;font-family:inherit;min-height:44px}
  .btn-correction:hover{background:#eef0f6;border-color:var(--border-hover)}
  .correction{display:none;margin-top:12px;background:#14161f;color:#dbe2f0;padding:16px;border-radius:10px;border:1px solid var(--border);border-left:3px solid #f59e0b;font-family:'SF Mono',Consolas,monospace;font-size:.76rem;line-height:1.6;width:100%;min-height:220px;resize:vertical;white-space:pre;overflow-x:auto}
  .correction:focus{outline:none}
  .barre{text-decoration:line-through;color:#dc2626;font-weight:700;background:rgba(239,68,68,.1);padding:0 3px;border-radius:3px}
  .tabs-forms{display:flex;gap:6px;margin-bottom:16px;background:#ffffff;padding:4px;border-radius:12px;border:1px solid var(--border)}
  .tabs-forms button{flex:1;padding:10px 8px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-weight:700;font-size:.75rem;cursor:pointer;font-family:inherit;min-height:40px}
  .tabs-forms button.actif{background:linear-gradient(135deg,var(--accent),#ec4899);color:white}
  .captcha-box{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:14px;background:#ffffff;border:1px solid var(--border);border-radius:12px}
  .captcha-visual{position:relative;padding:12px 22px;background:rgba(0,0,0,.3);border-radius:10px;border:1.5px dashed var(--accent);flex:1;text-align:center}
  .captcha-texte{font-size:22px;font-weight:800;letter-spacing:6px;font-style:italic;color:#a78bfa;user-select:none;font-family:'SF Mono',monospace}
  .barre-captcha{position:absolute;top:50%;left:6px;right:6px;height:2px;background:#ef4444;transform-origin:center}
  .grid-captcha{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;max-width:290px;margin-left:auto;margin-right:auto}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:36px;background:#ffffff;border:2px solid var(--border);border-radius:12px;cursor:pointer;user-select:none;transition:all .2s}
  .cell:hover{border-color:var(--accent);transform:scale(1.05)}
  .captcha-consigne{text-align:center;color:#a78bfa;font-weight:800;padding:10px 14px;background:rgba(124,109,242,.1);border:1px solid rgba(124,109,242,.25);border-radius:10px;margin-bottom:12px;font-size:.85rem}
  .info-validation{width:100%;text-align:right;font-size:.72rem;font-weight:700;margin-bottom:8px}
  .audio-box{padding:16px;background:#ffffff;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;text-align:center}
  .audio-emoji{font-size:3rem;margin-bottom:12px;display:block;transition:transform .2s}
  .audio-emoji.playing{animation:bounceA 1s ease-in-out infinite}
  @keyframes bounceA{0%,100%{transform:scale(1) rotate(-5deg)}50%{transform:scale(1.15) rotate(5deg)}}
  .audio-controls{display:flex;gap:10px;justify-content:center}
  .array-box{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:#ffffff;border:1px solid var(--border);border-radius:10px;margin-bottom:14px;min-height:60px;align-items:center;justify-content:center}
  .array-item{padding:6px 12px;background:rgba(124,109,242,.2);border:1px solid rgba(124,109,242,.4);border-radius:8px;font-weight:700;font-size:.85rem;color:#a78bfa}
  .array-item .idx{opacity:.5;font-size:.7rem;margin-right:4px}
  .quiz-progress{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:12px 14px;background:#ffffff;border-radius:10px;border:1px solid var(--border)}
  .quiz-progress-bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}
  .quiz-progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:10px;transition:width .4s;width:0%}
  .quiz-progress-text{font-size:.78rem;font-weight:800;white-space:nowrap}
  .quiz-question{background:#ffffff;border:1.5px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;text-align:center}
  .quiz-question-label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
  .quiz-question-expr{font-family:'SF Mono',monospace;font-size:1.6rem;font-weight:800;color:#f472b6;padding:12px;background:rgba(0,0,0,.3);border-radius:8px;margin-bottom:16px;word-break:break-all}
  .quiz-answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  @media (max-width:420px){.quiz-answers{grid-template-columns:1fr}}
  .quiz-field label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .quiz-field input,.quiz-field select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:#ffffff;color:var(--text);font-size:.95rem;font-family:inherit}
  .quiz-field input:focus,.quiz-field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,109,242,.15)}
  .quiz-field input.correct,.quiz-field select.correct{border-color:#22c55e;background:rgba(34,197,94,.1)}
  .quiz-field input.wrong,.quiz-field select.wrong{border-color:#ef4444;background:rgba(239,68,68,.1)}
  .quiz-feedback{padding:14px 16px;border-radius:10px;font-size:.88rem;line-height:1.6;margin-bottom:14px;min-height:20px;display:none}
  .quiz-feedback.success{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#15803d}
  .quiz-feedback.error{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#dc2626}
  .quiz-feedback code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px;font-family:'SF Mono',monospace;color:#b45309}
  .quiz-score{padding:16px;background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(99,102,241,.15));border:1px solid rgba(59,130,246,.3);border-radius:12px;text-align:center;margin-bottom:16px}
  .quiz-score-value{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#3b82f6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .quiz-score-label{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:4px}
  .quiz-done{padding:24px;background:#ffffff;border:1px solid var(--border);border-radius:12px;text-align:center}
  .quiz-done-emoji{font-size:3rem;margin-bottom:12px;display:block}
  .quiz-done h3{font-size:1.1rem;font-weight:800;margin-bottom:8px;color:#15803d}
  .quiz-done p{color:var(--muted);font-size:.88rem;line-height:1.6;margin-bottom:16px}
  .solutions-tabs{display:flex;gap:6px;margin-bottom:14px;background:#ffffff;padding:4px;border-radius:12px;border:1px solid var(--border)}
  .solutions-tabs button{flex:1;padding:10px 6px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-weight:700;font-size:.72rem;cursor:pointer;font-family:inherit;min-height:44px;line-height:1.2}
  .solutions-tabs button.actif{background:linear-gradient(135deg,var(--accent),#ec4899);color:white}
  .solution-card{background:#ffffff;border:1.5px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:14px}
  .solution-card h4{font-size:.88rem;font-weight:800;color:#a78bfa;margin-bottom:10px}
  .solution-card .avantages{font-size:.78rem;line-height:1.6;color:#c8cee0;margin-bottom:8px}
  .solution-card .avantages strong{color:#15803d}
  .solution-card .inconvenients strong{color:#dc2626}
  .solution-card code{background:rgba(0,0,0,.4);padding:2px 6px;border-radius:4px;color:#f472b6;font-family:'SF Mono',monospace;font-size:.82em}
  .solution-card pre{background:#05070d;padding:10px 12px;border-radius:8px;font-family:'SF Mono',monospace;font-size:.75rem;line-height:1.5;color:#b8c4dc;overflow-x:auto;margin-top:8px;white-space:pre}
  .demo-result{margin-top:12px;padding:12px 14px;background:rgba(0,0,0,.3);border-radius:8px;font-size:1rem;color:var(--text);min-height:40px}
  @media (min-width:640px){
    .grille{grid-template-columns:repeat(2,1fr);gap:14px}
    .panneau{left:auto;right:0;top:0;bottom:0;width:100%;max-width:520px;max-height:100vh;border-radius:0;border-left:1px solid var(--border);border-top:none;transform:translateX(100%)}
    .panneau.ouvert{transform:translateX(0)}
    .panneau-handle{display:none}
  }
  @media (min-width:900px){.grille{grid-template-columns:repeat(3,1fr)}}

const TOTAL = FAMILLES.reduce((s,f)=>s+f.exercices.length,0);

/* ============================================================
   ÉTAT
   ============================================================ */
const STORAGE_KEY = "js_defis_v12";
let visites = new Set();
let familleActive = "A";

function chargerVisites(){
  try { const s=localStorage.getItem(STORAGE_KEY); if(s) visites=new Set(JSON.parse(s)); } catch(e){ visites=new Set(); }
  if(visites.size===0) visites.add(1);
}
function sauvegarderVisites(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(Array.from(visites))); }catch(e){} }

/* ============================================================
   RENDU
   ============================================================ */
function rendreOnglets(){
  const nav = document.getElementById("familles-tabs");
  nav.innerHTML = "";
  FAMILLES.forEach(fam=>{
    const nb = fam.exercices.filter(ex=>visites.has(ex.id)).length;
    const btn = document.createElement("button");
    btn.className = "famille-tab" + (fam.id===familleActive?" actif":"");
    btn.dataset.fam = fam.id;
    btn.innerHTML = `<span class="tab-emoji">${fam.emoji}</span><span>${fam.nom}</span><span class="tab-count">${nb}/${fam.exercices.length}</span>`;
    btn.onclick = ()=>changerFamille(fam.id);
    nav.appendChild(btn);
  });
}

function rendreContenu(){
  const fam = FAMILLES.find(f=>f.id===familleActive);
  const nb = fam.exercices.filter(ex=>visites.has(ex.id)).length;
  document.getElementById("famille-header-slot").innerHTML = `
    <div class="famille-header" style="--fam-color:${fam.couleur};--fam-color-bg:${fam.bg};">
      <div class="fh-icon">${fam.emoji}</div>
      <div>
        <h2>Famille ${fam.id} — ${fam.nom}</h2>
        <p>${nb} sur ${fam.exercices.length} exercice${fam.exercices.length>1?'s':''} visité${nb>1?'s':''}</p>
      </div>
    </div>`;

  const grille = document.getElementById("grille");
  grille.innerHTML = "";
  fam.exercices.forEach(ex=>{
    const v = visites.has(ex.id);
    const nivCls = ex.niveau==="Facile"?"badge-facile":ex.niveau==="Moyen"?"badge-moyen":"badge-difficile";
    const stars = ex.niveau==="Facile"?"★":ex.niveau==="Moyen"?"★★":"★★★";
    const card = document.createElement("button");
    card.className = "card" + (v?" visite":"");
    card.style.setProperty("--fam-color", fam.couleur);
    card.style.setProperty("--fam-color-bg", fam.bg);
    card.onclick = ()=>ouvrirExercice(ex.id);
    card.innerHTML = `
      <div class="card-icon">${ex.emoji}</div>
      <div class="card-content">
        <div class="card-title">${ex.titre}</div>
        <div class="card-meta">
          <span class="badge-niveau ${nivCls}">${stars} ${ex.niveau}</span>
          <span class="card-status">${v?"✓ Déjà visité":"À découvrir"}</span>
        </div>
      </div>
      <div class="card-arrow">→</div>`;
    grille.appendChild(card);
  });
}

function changerFamille(id){ familleActive=id; rendreOnglets(); rendreContenu(); window.scrollTo({top:0,behavior:"smooth"}); }

function majProgression(){
  document.getElementById("progress-fill").style.width = (visites.size/TOTAL)*100 + "%";
  document.getElementById("progress-text").textContent = visites.size + "/" + TOTAL;
}

/* ============================================================
   OUVERTURE
   ============================================================ */
function ouvrirExercice(id){
  const ex = trouverExercice(id);
  const fam = trouverFamille(id);
  if(!ex||!fam) return;
  visites.add(id); sauvegarderVisites();
  majProgression(); rendreOnglets(); rendreContenu();
  document.getElementById("ph-icon").innerHTML = ex.emoji;
  document.getElementById("ph-icon").style.background = fam.bg;
  document.getElementById("ph-title").innerHTML = ex.titre;
  document.getElementById("panneau-body").innerHTML = genererContenu(id);
  document.getElementById("panneau").classList.add("ouvert");
  document.getElementById("overlay").classList.add("actif");
  document.body.style.overflow = "hidden";
  initialiserExercice(id);
}

function fermerPanneau(){
  document.getElementById("panneau").classList.remove("ouvert");
  document.getElementById("overlay").classList.remove("actif");
  document.body.style.overflow = "";
  document.querySelectorAll("audio").forEach(a=>{ if(!a.paused) a.pause(); });
}

function trouverExercice(id){ for(const f of FAMILLES) for(const ex of f.exercices) if(ex.id===id) return ex; return null; }
function trouverFamille(id){ for(const f of FAMILLES) for(const ex of f.exercices) if(ex.id===id) return f; return FAMILLES[0]; }

function initialiserExercice(id){
  if(id===1) quizInit();

  if(id===3) ex3_afficher("for");
  if(id===4) ex4_afficher(1);

  if(id===19) ex19_parser();
  if(id===20) ex20_analyser();
  if(id===21) ex21_formats();
  if(id===22) ex22_rapport();
  if(id===26) ex26_creer();
  if(id===28) ex28_reset();
  if(id===33) cap33_generer();
  if(id===34) cap34_generer();
  if(id===35) cap35_generer();
}

/* ============================================================
   EX 1 — QUIZ
   ============================================================ */
const QUIZ = [
  {e:'5 + "6"', v:"56", t:"string"},
  {e:'"5" + 6', v:"56", t:"string"},
  {e:'"5" + "6"', v:"56", t:"string"},
  {e:'5 + 6', v:"11", t:"number"},
  {e:'5 - "6"', v:"-1", t:"number"},
  {e:'5 - 6', v:"-1", t:"number"},
  {e:'5 * "6"', v:"30", t:"number"},
  {e:'"5" * 6', v:"30", t:"number"},
  {e:'5 / "6"', v:"0.8333333333333334", t:"number"},
  {e:'5 / "blabla"', v:"NaN", t:"NaN"},
  {e:'"ab" + 6', v:"ab6", t:"string"},
  {e:'"ab" + 6 + 5', v:"ab65", t:"string"},
  {e:'6 + 5 + "ab"', v:"11ab", t:"string"},
  {e:'"ab" - 6', v:"NaN", t:"NaN"}
];
let qi = 0, qs = 0, qDone = false;

function quizInit(){ qi=0; qs=0; qDone=false; quizRendre(); }

function quizRendre(){
  const z = document.getElementById("quiz-zone");
  if(!z) return;
  if(qi >= QUIZ.length){
    z.innerHTML = `<div class="quiz-done"><span class="quiz-done-emoji">🎉</span><h3>Quiz terminé !</h3><p>Score : <strong style="color:#15803d">${qs} / ${QUIZ.length}</strong></p><button class="btn" onclick="quizInit()">🔄 Recommencer</button></div>`;
    quizMaj(); return;
  }
  const q = QUIZ[qi];
  z.innerHTML = `
    <div class="quiz-question">
      <div class="quiz-question-label">Question ${qi+1} / ${QUIZ.length}</div>
      <div class="quiz-question-expr">${q.e}</div>
      <div class="quiz-answers">
        <div class="quiz-field"><label>Valeur</label><input type="text" id="q-val" placeholder="ex: 56"></div>
        <div class="quiz-field"><label>Type</label><select id="q-type"><option value="">— Choisir —</option><option value="number">number</option><option value="string">string</option><option value="NaN">NaN</option></select></div>
      </div>
      <button class="btn" onclick="quizValider()" style="width:100%">✅ Valider</button>
    </div>
    <div class="quiz-feedback" id="q-fb"></div>`;
  quizMaj();
}

function quizValider(){
  if(qDone) return;
  const q = QUIZ[qi];
  const iV = document.getElementById("q-val"), iT = document.getElementById("q-type"), fb = document.getElementById("q-fb");
  const rV = iV.value.trim(), rT = iT.value;
  if(rV===""||rT===""){ fb.className="quiz-feedback error"; fb.innerHTML="⚠️ Remplis les deux champs."; return; }
  let vOk = false;
  if(q.v==="0.8333333333333334"){ const n=parseFloat(rV); if(!isNaN(n)&&Math.abs(n-0.8333333333333334)<0.01) vOk=true; }
  else vOk = rV.toLowerCase()===q.v.toLowerCase();
  const tOk = rT===q.t;
  const all = vOk && tOk;
  iV.className = vOk?"correct":"wrong";
  iT.className = tOk?"correct":"wrong";
  iV.disabled = iT.disabled = true;
  if(all){ qs++; fb.className="quiz-feedback success"; fb.innerHTML=`✅ <code>${q.e}</code> = <code>${q.v}</code> (${q.t})`; }
  else { fb.className="quiz-feedback error"; let d=""; if(!vOk)d+=`Valeur : <code>${q.v}</code><br>`; if(!tOk)d+=`Type : <code>${q.t}</code>`; fb.innerHTML=`❌ <code>${q.e}</code><br>${d}`; }
  const nb = document.createElement("button");
  nb.className="btn"; nb.style.width="100%"; nb.style.marginTop="12px";
  nb.innerHTML = qi<QUIZ.length-1?"Suivant →":"Résultat 🎉";
  nb.onclick = ()=>{ qi++; qDone=false; quizRendre(); };
  fb.appendChild(nb);
  qDone = true;
  quizMaj();
}

function quizMaj(){
  const f = document.getElementById("quiz-fill"), t = document.getElementById("quiz-progress-text"), s = document.getElementById("quiz-score");
  if(f){ f.style.width = (qi/QUIZ.length*100)+"%"; }
  if(t){ t.textContent = Math.min(qi+1,QUIZ.length) + " / " + QUIZ.length; }
  if(s){ s.textContent = qs + " / " + QUIZ.length; }
}

  } else {

  case note >= 16: mention = "Très bien"; break;

  default: mention = "Insuffisant";

  }
}

function ex2_go(mode){
  const note = Number(document.getElementById("ex2_note").value);
  const r = document.getElementById("ex2_demo");
  if(isNaN(note)||note<0||note>20){ r.innerHTML="❌ Note 0–20"; return; }
  let m = "";
  if(mode==="if"){
    if(note>=16) m="Très bien"; else if(note>=14) m="Bien"; else if(note>=12) m="Assez bien"; else if(note>=10) m="Passable"; else m="Insuffisant";
  } else {
    switch(true){
      case note>=16: m="Très bien"; break;
      case note>=14: m="Bien"; break;
      case note>=12: m="Assez bien"; break;
      case note>=10: m="Passable"; break;
      default: m="Insuffisant";
    }
  }
  r.innerHTML = `Note : <strong>${note}</strong> → Mention : <strong style="color:#15803d">${m}</strong>`;
}

  for(let i=0;i<cap35_sel.length;i++) if(cap35_sel[i]===n){ pos=i; break; }
  if(pos!==-1){
    const nv = [];
    for(let j=0;j<cap35_sel.length;j++) if(j!==pos) nv[nv.length]=cap35_sel[j];
    cap35_sel = nv;
    c.style.borderColor="rgba(255,255,255,.08)"; c.style.background="#ffffff";
  } else {
    cap35_sel[cap35_sel.length] = n;
    c.style.borderColor="#22c55e"; c.style.background="rgba(34,197,94,.2)";
  }
}
function cap35_verifier(){
  const r = document.getElementById("cap35_res");
  if(cap35_sel.length===0){ r.innerHTML="⚠️ Sélectionne au moins une image"; r.style.color="#f59e0b"; return; }
  if(cap35_sel.length!==cap35_indices.length){ r.innerHTML="❌ Incorrect"; r.style.color="#ef4444"; cap35_generer(); return; }
  let ok = true;
  for(let i=0;i<cap35_indices.length;i++){
    let t = false;
    for(let j=0;j<cap35_sel.length;j++) if(cap35_sel[j]===cap35_indices[i]){ t=true; break; }
    if(!t){ ok=false; break; }
  }
  if(ok){ r.innerHTML="🎉 Bravo !"; r.style.color="#22c55e"; cap35_termine=true; }
  else { r.innerHTML="❌ Incorrect"; r.style.color="#ef4444"; cap35_generer(); }
}

function ex36_play(){
  const a = document.getElementById("ex36_audio");
  const r = document.getElementById("ex36_res");
  const e = document.getElementById("ex36_emoji");
  if(!a) return;
  a.play().then(()=>{ r.innerHTML="▶️ Lecture (paused = false)"; r.style.color="#22c55e"; if(e) e.classList.add("playing"); })
    .catch(err=>{ r.innerHTML="❌ "+err.message; r.style.color="#ef4444"; });
}
function ex36_pause(){
  const a = document.getElementById("ex36_audio");
  const r = document.getElementById("ex36_res");
  const e = document.getElementById("ex36_emoji");
  if(!a) return;
  a.pause();
  r.innerHTML="⏸️ Pause (paused = true)"; r.style.color="#f59e0b";
  if(e) e.classList.remove("playing");
}

function toggleCorrection(n){
  const b = document.getElementById("corr"+n);
  if(!b) return;
  const btn = b.previousElementSibling;
  if(b.style.display === "block"){
    b.style.display = "none";
    btn.innerHTML = "Voir la correction";
  } else {
    b.value = CORR[n] || "";

    btn.innerHTML = "🙈 Masquer la correction";
  }
}
