<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="utf-8">
   <title>Enregistrer une recharge</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>⚡ Enregistrer une recharge</h2>

<!-- L'heure actuelle s'affiche dès l'entrée dans la page -->
<p id="horloge" style="font-weight:bold; font-size:18px"></p>
<p>🕗 <b>Horaires de travail de la station :</b>
   le matin de <b>8h00 à 12h00</b>, l'après-midi de <b>13h00 à 18h00</b>
   (fermé entre 12h00 et 13h00).</p>

<form method="post" action="ajouter.php" target="cadre"
      onsubmit="return validerInscription()">
   <label>Id (ex. R01) :</label>
   <input type="text" id="Id" name="Id"><br>

   <label>Conducteur (Nom et prénom) :</label>
   <input type="text" id="Nom_prenom" name="Nom_prenom"><br>

   <label>Station (borne) :</label>
   <select id="Borne" name="Borne">
      <option value="S1">Station 1</option>
      <option value="S2">Station 2</option>
      <option value="S3">Station 3</option>
      <option value="S4">Station 4</option>
   </select><br>

   <label>Énergie rechargée (kWh) :</label>
   <input type="number" id="Kwh" name="Kwh" step="0.01"><br>

   <label>Date de la recharge :</label>
   <input type="date" id="DateRecharge" name="DateRecharge"><br>

   <label>Heure de la recharge (entre 8h00-12h00 ou 13h00-18h00) :</label>
   <input type="time" id="HeureRecharge" name="HeureRecharge" min="08:00" max="18:00"><br>

   <p id="message"></p>

   <input type="submit" name="ok" value="Enregistrer">
   <input type="reset" value="Effacer">
</form>

<script src="validation.js"></script>
</body>
</html>
