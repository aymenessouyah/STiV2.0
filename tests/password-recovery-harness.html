<!doctype html><html lang="fr"><meta charset="utf-8"><title>Récupération mot de passe v307</title><body>
<div class="onglets"><button id="tab-connexion" type="button">Connexion</button></div>
<form id="f-connexion"></form><form id="f-inscription"></form><form id="f-oubli"></form><div id="zone-code"></div>
<form id="f-nouveau-mdp" hidden>
  <input id="n-mdp" type="password" minlength="8" />
  <input id="n-mdp2" type="password" minlength="8" />
  <button id="b-nouveau-mdp" type="submit" disabled>✅ Enregistrer le nouveau mot de passe</button>
  <button id="b-nouveau-lien" type="button">📨 Demander un nouveau lien</button>
</form>
<input id="c-email" /><p id="msg"></p>
<script src="../assets/js/modules/password-recovery.js"></script>
<script>
window.__calls = [];
var sb = { auth: {
  exchangeCodeForSession: async function (code) { window.__calls.push({ name: 'exchange', code: code }); return { data: { session: { user: { email: 'candidat@example.tn' } } }, error: null }; },
  verifyOtp: async function (args) { window.__calls.push({ name: 'verifyOtp', args: args }); return { data: { session: { user: { email: 'candidat@example.tn' } } }, error: null }; },
  setSession: async function (args) { window.__calls.push({ name: 'setSession', args: args }); return { data: { session: { user: { email: 'candidat@example.tn' } } }, error: null }; },
  updateUser: async function (args) { window.__calls.push({ name: 'updateUser', args: args }); return { data: { user: { email: 'candidat@example.tn' } }, error: null }; },
  signOut: async function (args) { window.__calls.push({ name: 'signOut', args: args }); return { error: null }; }
} };
document.getElementById('tab-connexion').onclick = function () { document.getElementById('f-connexion').hidden = false; };
window.__ready = window.STI_PASSWORD_RECOVERY.start({
  sb: sb,
  root: './',
  message: function (text, type) { var m = document.getElementById('msg'); m.textContent = text; m.dataset.type = type || ''; }
});
</script></body></html>
